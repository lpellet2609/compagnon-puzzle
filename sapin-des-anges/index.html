<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Literata:opsz,wght@7..72,400;7..72,600&family=DM+Serif+Display&family=Figtree:wght@400;500;600;700&display=swap">

<body>
<div class="wrap" id="root"><p class="lead">Chargement du Betlehem…</p></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = (n) => Number(n).toLocaleString('fr-FR') + ' €';
// Face « Listes » : 7 boules du sapin (centre x, y et rayon en px sur l'image 900 × 1186)
const BALLS = [[300, 520, 42], [569, 495, 29], [637, 630, 27], [350, 672, 28], [520, 763, 40], [248, 898, 28], [211, 1023, 37]];
const TREE_W = 900, TREE_H = 1186, FACE_RATIO = 1.25;           // l'objet a le format de la crèche (4:5)
const TREE_CROP = (TREE_H / TREE_W - FACE_RATIO) / 2;            // part rognée en haut et en bas
// Face « Calendrier » : 24 fenêtres sur la crèche, grille 5 × 5 ; la 24 sur la mangeoire, la case vide sur la signature
const CAL_X = [12, 31, 50, 69, 88], CAL_Y = [10, 27, 44, 61, 78];
const CAL_ORDER = [7, 15, 3, 20, 11, 22, 1, 18, 9, 5, 13, 19, 2, 16, 4, 10, 21, 24, 8, 23, 17, 6, 12, 14, 0];
const MOIS = 'décembre';
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
let view = 'facade', entering = false, side = 'cal', preview = false, DAYS = null, swipeAt = 0;
side = 'cal';
let S = null, sel = null, openShare = null, busy = false;

function toast(t) {
  const el = $('#toast'); el.textContent = t; el.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600);
}
async function api(action, data = {}) {
  const r = await fetch('/api/app', {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...data }),
  });
  let j = {}; try { j = await r.json(); } catch {}
  if (!r.ok) { const e = new Error(j.error || 'Connexion impossible. Vérifie ton réseau.'); e.status = r.status; throw e; }
  return j;
}
const nm = (id) => { const p = S.people.find((x) => x.id === id); return p ? p.name : 'un ancien membre'; };
const who = (id) => (id === S.me ? 'moi' : esc(nm(id)));

// ---------- Écrans d'accès ----------
function screen(html) { $('#root').innerHTML = `<div class="gate">${html}</div>`; }
function showMessage(title, msg) {
  screen(`<h1>Le Betlehem des Anges</h1><h2>${esc(title)}</h2><p class="lead">${esc(msg)}</p>`);
}
// Le lien de groupe est gardé sur l'appareil pour pouvoir revenir au choix du prénom.
const store = {
  get() { try { return localStorage.getItem('sapinInvite') || ''; } catch { return ''; } },
  set(v) { try { localStorage.setItem('sapinInvite', v); } catch {} },
};
function showPin(h, send, onBack) {
  const choose = !h.hasPin;
  screen(`<h1>Le Betlehem des Anges</h1>
    <h2>${choose ? `Tu es bien ${esc(h.name)} ?` : `Bonjour ${esc(h.name)} !`}</h2>
    <p class="lead">${choose
      ? 'Choisis ton code secret à 4 chiffres et garde-le pour toi. Il protège tes surprises. Évite ton année de naissance.'
      : 'Tape ton code secret à 4 chiffres.'}</p>
    <form id="pinForm" class="pinform" autocomplete="off">
      <div class="field"><label for="pin1">${choose ? 'Mon code' : 'Code'}</label>
        <input id="pin1" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autofocus></div>
      ${choose ? `<div class="field"><label for="pin2">Je le retape</label>
        <input id="pin2" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></div>` : ''}
      <p class="warn" id="pinErr" role="alert"></p>
      <button class="btn primary" type="submit">${choose ? 'Choisir ce code' : 'Entrer'}</button>
    </form>
    <p class="small">${choose ? 'Retiens-le bien : il te sera demandé sur chaque nouveau téléphone ou ordinateur.' : 'Code oublié ? Demande à l’organisateur de réinitialiser ton accès.'}</p>
    ${onBack ? '<button class="btn ghost" id="pinBack" type="button">← Ce n’est pas moi</button>' : ''}`);
  if (onBack) $('#pinBack').addEventListener('click', onBack);
  $('#pinForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const p1 = $('#pin1').value.trim();
    const err = $('#pinErr');
    if (choose && p1 !== $('#pin2').value.trim()) { err.textContent = 'Les deux codes ne sont pas identiques.'; return; }
    try {
      await send(p1, choose);
      history.replaceState(null, '', location.pathname);
      S = await api('state'); sel = null; afterLogin();
    } catch (x) { err.textContent = x.message; $('#pin1').value = ''; if ($('#pin2')) $('#pin2').value = ''; $('#pin1').focus(); }
  });
}
async function showPicker(invite) {
  let info;
  try { info = await api('inviteInfo', { invite }); }
  catch (e) { showMessage('Lien non reconnu', e.message); return; }
  screen(`<h1>Le Betlehem des Anges</h1>
    <h2>Qui es-tu ?</h2>
    <p class="lead">Appuie sur ton prénom.</p>
    <div class="picker">${info.people.map((p) => `<button class="pick" type="button" data-pick="${p.id}">${esc(p.name)}</button>`).join('')}</div>`);
  document.querySelectorAll('[data-pick]').forEach((btn) => btn.addEventListener('click', () => {
    const h = info.people.find((x) => x.id === btn.dataset.pick);
    showPin(h, (pin, choose) => api(choose ? 'inviteSetPin' : 'inviteLogin', { invite, id: h.id, pin }), () => showPicker(invite));
  }));
}
// ---------- Installation sur l'écran d'accueil ----------
let deferredPrompt = null, lastToken = '';
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
addEventListener('appinstalled', () => { deferredPrompt = null; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const installSeen = () => { try { return localStorage.getItem('sapinInstallSeen') === '1'; } catch { return false; } };
function afterLogin() {
  if (!isStandalone() && !installSeen()) showInstall(() => startApp());
  else startApp();
}
function showInstall(done) {
  // Sur iPhone, l'icône garde l'adresse affichée : on y remet le lien de groupe pour se reconnecter depuis l'icône
  const invite = store.get();
  const back = invite ? '/?g=' + encodeURIComponent(invite) : lastToken ? '/?t=' + encodeURIComponent(lastToken) : '/';
  if (isIOS()) history.replaceState(null, '', back);
  const finish = () => { history.replaceState(null, '', location.pathname); try { localStorage.setItem('sapinInstallSeen', '1'); } catch {} done(); };
  const SHARE = '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4M6 11v9h12v-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const PLUS = '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  screen(`<img src="/icon-192.png" alt="" width="72" height="72" class="appicon">
    <h1>Le Betlehem des Anges</h1>
    <h2>Installe-le sur ton écran d’accueil</h2>
    <p class="lead">Tu le retrouveras d’un seul geste, comme une appli. C’est aussi ce qui permettra de recevoir le rappel du soir.</p>
    ${deferredPrompt ? '<button class="btn primary" id="doInstall" type="button">Ajouter à l’écran d’accueil</button>'
      : isIOS() ? `<ol class="isteps">
          <li><span class="iico">${SHARE}</span><span>Appuie sur <b>Partager</b>, en bas de Safari</span></li>
          <li><span class="iico">${PLUS}</span><span>Choisis <b>Sur l’écran d’accueil</b> (fais défiler la liste si besoin)</span></li>
          <li><span class="iico"><b>OK</b></span><span>Appuie sur <b>Ajouter</b>, en haut à droite</span></li>
        </ol>
        <p class="small">Ouvre ensuite le Betlehem depuis la nouvelle icône étoilée : appuie sur ton prénom et tape ton code, une dernière fois.</p>
        <p class="small">Tu ne vois pas « Partager » ? Ouvre d’abord ce lien dans Safari.</p>`
      : '<p class="lead">Dans le menu de ton navigateur (⋮), choisis <b>Ajouter à l’écran d’accueil</b> ou <b>Installer l’application</b>.</p>'}
    <button class="btn ghost" id="later" type="button">${isIOS() ? 'C’est fait, continuer' : 'Plus tard'}</button>`);
  $('#later').addEventListener('click', finish);
  const b = $('#doInstall');
  if (b) b.addEventListener('click', async () => {
    deferredPrompt.prompt();
    try { await deferredPrompt.userChoice; } catch {}
    deferredPrompt = null; finish();
  });
}
function showNoAccess(title) {
  const invite = store.get();
  if (invite) { showPicker(invite); return; }
  showMessage(title, 'Pour entrer dans le Betlehem, ouvre le lien reçu sur WhatsApp.');
}

async function boot() {
  const q = new URLSearchParams(location.search);
  const token = q.get('t'), invite = q.get('g');
  // Aperçu réservé à l'organisateur : toutes les fenêtres ouvrables, rien n'est enregistré
  const ap = q.get('apercu');
  if (ap) {
    try { await api('adminList', { key: ap }); preview = true; try { sessionStorage.setItem('sapinApercu', '1'); } catch {} } catch {}
    history.replaceState(null, '', location.pathname);
  } else { try { preview = sessionStorage.getItem('sapinApercu') === '1'; } catch {} }
  if (invite) {
    store.set(invite);
    history.replaceState(null, '', location.pathname);
    try { S = await api('state'); afterLogin(); } catch { showPicker(invite); }
    return;
  }
  if (token) {
    lastToken = token;
    let h;
    try { h = await api('hello', { token }); }
    catch (e) { showMessage('Lien non reconnu', e.message); return; }
    try {
      const st = await api('state');
      if (st.me === h.id) { history.replaceState(null, '', location.pathname); S = st; afterLogin(); return; }
    } catch {}
    showPin(h, (pin, choose) => api(choose ? 'setPin' : 'login', { token, pin }));
    return;
  }
  try { S = await api('state'); afterLogin(); }
  catch (e) {
    if (e.status === 401) showNoAccess('Bienvenue');
    else showMessage('Oups', e.message);
  }
}
async function loadApp() { S = await api('state'); sel = null; startApp(); }

// ---------- Application ----------
function startApp() {
  if (!sel || !S.people.some((p) => p.id === sel)) sel = S.me;
  $('#root').innerHTML = `
    <div id="facade" class="facade">
      <header class="top">
        <div>
          <h1>Le Betlehem des Anges</h1>
        </div>
        <div class="controls">
          <p class="count" id="countdown"></p>
          ${isStandalone() ? '' : '<button class="btn ghost" id="installBtn" type="button">Installer</button>'}
          <button class="btn ghost" id="logout" type="button">Ce n’est pas moi</button>
        </div>
      </header>
      ${preview ? '<p class="demo">Mode aperçu : toutes les fenêtres sont ouvertes pour toi, rien n’est enregistré.</p>' : ''}
      <div class="stage" id="stage"><div class="scene" id="scene">
        <div class="flip" id="flip">
          <div class="face cal" id="faceCal"></div>
          <div class="face tree" id="faceTree"></div>
        </div>
      </div></div>
      <div class="chips" id="chips" aria-label="Ouvrir l’espace d’une personne"></div>
      <section class="section" id="legend">
        <h3>Qui voit quoi</h3>
        <div class="legend">
          <div><b>Mes vœux</b>Visibles par toute la famille.</div>
          <div><b>Idées secrètes pour moi</b>Visibles par les autres, jamais par moi.</div>
          <div><b>Réservations et cagnottes</b>Jamais visibles par la personne qui reçoit. Les autres voient le total et le reste à financer ; seul l’acheteur voit qui a mis combien.</div>
        </div>
      </section>
    </div>
    <div id="room" class="room" hidden>
      <div class="roombar">
        <button class="btn" id="back" type="button">← Retour au sapin</button>
        <p class="count" id="countdown2"></p>
      </div>
      <main class="panel" id="panel"></main>
    </div>`;
  $('#logout').addEventListener('click', async () => {
    try { await api('logout'); } catch {}
    S = null; showNoAccess('À bientôt');
  });
  $('#back').addEventListener('click', leaveRoom);
  if ($('#installBtn')) $('#installBtn').addEventListener('click', () => showInstall(() => startApp()));
  bindSpin($('#stage'));
  view = 'facade';
  mode = 'spin'; chosen = false; ang = 0;
  render(); setAng(); startSpin();
}
function visible(pid) { return S.ideas.filter((i) => i.forId === pid); }
function countdown() {
  let html;
  const d = curDay();
  if (d >= 25) html = '<b>Boldog karácsonyt !</b>';
  else if (d >= 1) html = `<b>${25 - d}</b> jour${25 - d > 1 ? 's' : ''} avant Noël`;
  else { const n = Math.max(1, Math.ceil((Date.UTC(2026, 11, 1) - Date.now()) / 864e5)); html = `Première fenêtre dans <b>${n}</b> jour${n > 1 ? 's' : ''}`; }
  for (const id of ['#countdown', '#countdown2']) { const el = $(id); if (el) el.innerHTML = html; }
}
function leafStyle(x, y, w, h) {
  const l = x - w / 2, t = y - h / 2;
  return `left:${l}%;top:${t}%;width:${w}%;height:${h}%;--bs:${(100 / w) * 100}% ${(100 / h) * 100}%;--bp:${(l / (100 - w)) * 100}% ${(t / (100 - h)) * 100}%`;
}
const pad = (n) => String(n).padStart(2, '0');
function renderCalendar() {
  const opened = new Set(S.opened || []);
  const doors = CAL_ORDER.map((n, k) => {
    if (!n) return '';
    const big = n === 24, w = big ? 18 : 14.5, h = big ? 14.4 : 11.6;
    const x = CAL_X[k % 5] + (((n * 37) % 7) - 3) * 0.5, y = CAL_Y[Math.floor(k / 5)] + (((n * 53) % 7) - 3) * 0.4;
    const isOpen = opened.has(n) || (preview && false);
    const state = n > curDay() ? 'locked' : n === curDay() ? 'today' : '';
    return `<button class="door day${big ? ' big' : ''}${isOpen ? ' open' : ''}${state ? ' ' + state : ''}" type="button" data-day="${n}" style="${leafStyle(x, y, w, h)}"
        aria-label="Fenêtre du ${n} ${MOIS}${n > curDay() ? ', pas encore ouverte' : isOpen ? ', déjà ouverte' : ''}">
      <span class="inside" aria-hidden="true" style="background-image:url(/avent/t${pad(n)}.jpg)"></span>
      <span class="leaf" aria-hidden="true"><span class="num">${n}</span></span>
    </button>`;
  }).join('');
  $('#faceCal').innerHTML = `<img src="/creche.jpg" alt="Crèche de Noël avec 24 fenêtres de l’Avent" width="800" height="1000">${doors}`;
}
function renderTree() {
  const balls = S.people.slice(0, BALLS.length).map((p, k) => {
    const [bx, by, br] = BALLS[k]; const n = visible(p.id).length; const mine = p.id === S.me;
    const x = (bx / TREE_W) * 100, y = ((by / TREE_W - TREE_CROP) / FACE_RATIO) * 100, d = ((br * 2) / TREE_W) * 100;
    return `<button class="ball${mine ? ' mine' : ''}" type="button" data-person="${p.id}" style="left:${x}%;top:${y}%;width:${d}%"
        aria-label="Boule de ${esc(p.name)}${mine ? ' (toi)' : ''}, ${n} idée${n > 1 ? 's' : ''}">
      <span class="tag">${esc(p.name)}${n ? `<i>${n}</i>` : ''}</span>
    </button>`;
  }).join('');
  $('#faceTree').innerHTML = `<img src="/sapin.jpg" alt="Sapin de Noël décoré de boules rouges et dorées" width="900" height="1186">${balls}`;
}
function renderScene() {
  renderCalendar(); renderTree(); updateChrome();
}
// L'objet tourne seul sur lui-même ; on le fait tourner du doigt ; appuyer sur une face l'arrête sur cette face.
const SPIN_SPEED = 26;                                   // degrés par seconde (un tour en 14 s)
let ang = 0, mode = 'spin', target = 0, dragV = 0, spinRaf = 0, lastT = 0, chosen = false;
const curDay = () => (preview ? 24 : S.calDay);
const frontVisible = () => Math.cos((ang * Math.PI) / 180) > 0;
function setAng() { const f = $('#flip'); if (f) f.style.transform = `perspective(1600px) rotateY(${ang}deg)`; }
function updateChrome() {
  const showTree = mode === 'frozen' && side === 'tree';
  $('#chips').hidden = !showTree; $('#legend').hidden = !showTree;
  $('#chips').innerHTML = S.people.map((p) => `<button class="chip" type="button" data-person="${p.id}">${esc(p.name)}${p.id === S.me ? ' (moi)' : ''}</button>`).join('');
}
function snapTo(s) {
  side = s; chosen = true;
  const base = s === 'cal' ? 0 : 180;
  target = ang + ((((base - ang) % 360) + 540) % 360) - 180;
  mode = 'snap';
}
function startSpin() {
  cancelAnimationFrame(spinRaf); lastT = 0;
  if (reduceMotion()) { mode = 'frozen'; ang = side === 'tree' ? 180 : 0; setAng(); updateChrome(); return; }
  const loop = (t) => {
    if (!$('#flip')) return;
    const dt = Math.min(0.05, (t - (lastT || t)) / 1000); lastT = t;
    if (mode === 'spin') ang += SPIN_SPEED * dt;
    else if (mode === 'glide') {
      ang += dragV; dragV *= 0.93;
      if (Math.abs(dragV) < 0.25) { if (chosen) snapTo(frontVisible() ? 'cal' : 'tree'); else mode = 'spin'; }
    } else if (mode === 'snap') {
      ang += (target - ang) * 0.14;
      if (Math.abs(target - ang) < 0.3) { ang = target; mode = 'frozen'; updateChrome(); }
    }
    setAng();
    spinRaf = requestAnimationFrame(loop);
  };
  spinRaf = requestAnimationFrame(loop);
}
function bindSpin(el) {
  let x0 = null, last = 0, moved = 0, before = 'spin';
  el.addEventListener('pointerdown', (e) => {
    if (entering) return;
    x0 = last = e.clientX; moved = 0; before = mode;
  });
  el.addEventListener('pointermove', (e) => {
    if (x0 == null) return;
    const dx = e.clientX - last; last = e.clientX; moved += Math.abs(dx);
    if (moved > 8) { if (mode !== 'drag') { mode = 'drag'; updateChrome(); } ang += dx * 0.45; dragV = dx * 0.45; setAng(); }
  });
  const end = () => {
    if (x0 == null) return; x0 = null;
    if (mode === 'drag') { swipeAt = Date.now(); mode = 'glide'; if (before === 'frozen') chosen = true; }
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}
function originOn(el) {
  const scene = $('#scene'), r = el.getBoundingClientRect(), s = scene.getBoundingClientRect();
  scene.style.transformOrigin = `${((r.left + r.width / 2 - s.left) / s.width) * 100}% ${((r.top + r.height / 2 - s.top) / s.height) * 100}%`;
}
async function enterRoom(pid) {
  if (entering) return; entering = true;
  sel = pid; openShare = null;
  const ball = side === 'tree' ? document.querySelector(`.ball[data-person="${pid}"]`) : null;
  if (ball && !reduceMotion()) {
    ball.classList.add('open');
    await wait(550);
    originOn(ball);
    document.documentElement.classList.add('zooming');
    $('#stage').classList.add('zoom');
    await wait(850);
  }
  view = 'room';
  $('#facade').hidden = true; $('#room').hidden = false;
  document.documentElement.classList.remove('zooming');
  renderPanel(); countdown(); window.scrollTo(0, 0);
  entering = false;
}
async function leaveRoom() {
  view = 'facade';
  $('#room').hidden = true; $('#facade').hidden = false;
  side = 'tree'; mode = 'frozen'; chosen = true; ang = 180; setAng();
  renderScene(); countdown();
  const stage = $('#stage'), ball = document.querySelector(`.ball[data-person="${sel}"]`);
  window.scrollTo(0, Math.max(0, stage.getBoundingClientRect().top + scrollY - 80));
  if (reduceMotion() || !ball) return;
  originOn(ball);
  document.documentElement.classList.add('noscroll');
  ball.classList.add('open');
  stage.classList.add('zoom', 'instant');
  stage.offsetWidth; // force la position zoomée avant de reculer
  stage.classList.remove('instant');
  requestAnimationFrame(() => stage.classList.remove('zoom'));
  await wait(850);
  ball.classList.remove('open');
  document.documentElement.classList.remove('noscroll');
}

// ---------- Calendrier de l'Avent : ouvrir la fenêtre du jour ----------
async function loadDays() {
  if (DAYS) return DAYS;
  const r = await fetch('/avent/days.json'); if (!r.ok) throw new Error('Contenu indisponible.');
  DAYS = await r.json(); return DAYS;
}
const BONUS = {
  6: 'En Hongrie, c’est Mikulás : cette nuit, il a rempli de friandises les bottes bien cirées posées à la fenêtre.',
  13: 'En Hongrie, c’est Luca napja : on sème du blé dans une coupelle pour qu’il soit vert à Noël, et l’on commence la chaise de Luca, à terminer pour le 24.',
};
async function openDay(n, door) {
  if (entering) return;
  if (n > curDay()) {
    door.classList.remove('shake'); void door.offsetWidth; door.classList.add('shake');
    toast(curDay() < 1 ? 'Patience : la première fenêtre s’ouvre le 1er décembre.' : `Cette fenêtre s’ouvrira le ${n} ${MOIS}.`);
    return;
  }
  entering = true;
  const daysP = loadDays().catch(() => null);
  if (!reduceMotion()) {
    const first = !door.classList.contains('open');
    door.classList.add('open');
    if (first) { const b = document.createElement('span'); b.className = 'burst'; door.appendChild(b); setTimeout(() => b.remove(), 1600); }
    await wait(first ? 900 : 300);
    originOn(door);
    document.documentElement.classList.add('zooming');
    $('#stage').classList.add('zoom');
    await wait(850);
  } else door.classList.add('open');
  const days = await daysP;
  showDayCard(n, days);
  $('#stage').classList.add('instant'); $('#stage').classList.remove('zoom'); void $('#stage').offsetWidth; $('#stage').classList.remove('instant');
  document.documentElement.classList.remove('zooming');
  entering = false;
  if (!preview && !(S.opened || []).includes(n)) {
    S.opened = [...(S.opened || []), n];
    api('openDay', { day: n }).catch(() => {});
  }
}
// Typographie française : espace insécable avant ? ! : ; » et après «
const fr = (t) => esc(t).replace(/ ([?!:;»])/g, '\u202F$1').replace(/« /g, '«\u202F');
function showDayCard(n, days) {
  const d = days && days.find((x) => x.day === n);
  const el = document.createElement('div'); el.className = 'daycard'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  const unlocked = (k) => k >= 1 && k <= Math.min(24, curDay());
  el.innerHTML = d ? `
    <button class="btn dc-close" type="button" data-dc="close" aria-label="Fermer">✕</button>
    <div class="dc-img"><img src="/${d.img}" alt=""></div>
    <div class="dc-body">
      <p class="dc-day">${n} ${MOIS}</p>
      <h2>${fr(d.title)}</h2>
      <p class="dc-story">${fr(d.story)}</p>
      <div class="dc-toi">
        <p class="dc-q"><b>Et toi ?</b>${fr(d.question)}</p>
        <p class="dc-act"><b>Ma bonne action du jour</b>${fr(d.action)}</p>
      </div>
      ${BONUS[n] ? `<p class="dc-bonus">${esc(BONUS[n])}</p>` : ''}
      ${n === 24 ? `<p class="dc-bonus">${S.revealed ? 'La porte des souvenirs est ouverte : retrouve toutes les photos de la famille.' : 'Ce soir à 18 h, la porte des souvenirs s’ouvrira sur les photos de la famille.'}</p>` : ''}
      <p class="dc-ref">${esc(d.ref)}</p>
      <p class="dc-credit">${esc(d.credit)}</p>
      <div class="dc-nav">
        <button class="btn" type="button" data-dc="prev" ${unlocked(n - 1) ? '' : 'disabled'}>‹ ${n - 1 >= 1 ? n - 1 : ''}</button>
        <button class="btn" type="button" data-dc="next" ${unlocked(n + 1) ? '' : 'disabled'}>${n + 1 <= 24 ? n + 1 : ''} ›</button>
      </div>
    </div>`
    : `<button class="btn dc-close" type="button" data-dc="close" aria-label="Fermer">✕</button><div class="dc-body"><p class="dc-day">${n} ${MOIS}</p><h2>Contenu en préparation</h2><p class="lead">Reviens un peu plus tard.</p></div>`;
  document.body.appendChild(el);
  document.documentElement.classList.add('noscroll');
  el.addEventListener('click', (e) => {
    const a = e.target.closest('[data-dc]'); if (!a) return;
    if (a.dataset.dc === 'close') { el.remove(); document.documentElement.classList.remove('noscroll'); renderCalendar(); return; }
    const k = n + (a.dataset.dc === 'next' ? 1 : -1);
    if (!unlocked(k)) return;
    el.remove(); showDayCard(k, days);
    if (!preview && !(S.opened || []).includes(k)) { S.opened = [...(S.opened || []), k]; api('openDay', { day: k }).catch(() => {}); }
  });
}
const stars = (n) => n ? '★'.repeat(n) + '<span style="opacity:.3">' + '★'.repeat(3 - n) + '</span>' : '';
function metaLine(i, secretLabel) {
  return `<div class="meta">${i.prio ? `<span class="stars" aria-label="envie ${i.prio} sur 3">${stars(i.prio)}</span>` : ''}
    ${i.link ? `<a href="${esc(i.link)}" target="_blank" rel="noopener noreferrer">voir le lien</a>` : ''}
    ${secretLabel ? `<span class="who secret">${secretLabel}</span>` : ''}</div>`;
}
function cardMine(i) {
  const secret = i.byId !== i.forId;
  return `<div class="card${secret ? ' secret' : ''}">
    <div class="row"><span class="title">${esc(i.title)}</span>${i.price ? `<span class="price">${eur(i.price)}</span>` : ''}</div>
    ${metaLine(i, secret ? 'Imaginée par ' + esc(nm(i.byId)) : '')}
    ${secret ? '' : `<div class="status"><button class="btn ghost" data-act="removeIdea" data-id="${i.id}">Retirer de ma liste</button></div>`}
  </div>`;
}
function contribForm(i, suggest, label) {
  return `<div class="inline"><label for="amt-${i.id}" class="people">${label}</label>
    <input type="number" id="amt-${i.id}" min="1" step="1" value="${suggest || ''}" inputmode="numeric"><span>€</span>
    <button class="btn primary" data-act="contribute" data-id="${i.id}">Participer</button>
    ${openShare === i.id ? `<button class="btn ghost" data-act="closeShare" data-id="${i.id}">Annuler</button>` : ''}</div>`;
}
function statusOther(i) {
  const pot = i.pot;
  if (i.removed) {
    return `<p class="warn">${esc(nm(i.forId))} a retiré ce vœu de sa liste. Tu l’avais réservé : vérifie avant d’acheter.</p>
      <div class="status">${i.fullBy === S.me ? `<button class="btn" data-act="cancelOffer" data-id="${i.id}">Annuler ma réservation</button>` : ''}
      ${pot && pot.mine != null ? `<button class="btn" data-act="leave" data-id="${i.id}">Retirer ma part</button>` : ''}</div>`;
  }
  if (i.fullBy) {
    return `<div class="status"><span class="tag ok">${i.fullBy === S.me ? 'Je l’offre' : 'Offert par ' + esc(nm(i.fullBy))}</span>
      ${i.fullBy === S.me ? `<button class="btn ghost" data-act="cancelOffer" data-id="${i.id}">Annuler</button>` : ''}</div>`;
  }
  if (pot) {
    const p = i.price, t = pot.total, done = pot.remaining === 0, pct = Math.min(100, Math.round(t / p * 100));
    return `<div class="pot">
      <div class="line"><strong>Cadeau commun</strong><span>${eur(t)} / ${eur(p)}${done ? ' · financé' : ` · reste ${eur(pot.remaining)}`}</span></div>
      <div class="bar${done ? ' full' : ''}"><span style="width:${pct}%"></span></div>
      <p class="people">${pot.count} participant${pot.count > 1 ? 's' : ''} · achat : ${pot.buyer ? who(pot.buyer) : 'à désigner'}${pot.mine != null ? ` · ma part : ${eur(pot.mine)}` : ''}</p>
      ${pot.detail ? `<p class="people">À récupérer (visible par toi seul, l’acheteur) : ${pot.detail.filter((d) => d.by !== S.me).map((d) => `${esc(nm(d.by))} ${eur(d.amount)}`).join(' · ') || 'personne pour l’instant'}</p>` : ''}
      ${pot.mine != null
        ? `<div class="inline">${pot.buyer !== S.me ? `<button class="btn" data-act="takeBuyer" data-id="${i.id}">Je m’occupe de l’achat</button>` : ''}
           <button class="btn ghost" data-act="leave" data-id="${i.id}">Retirer ma part</button></div>`
        : done ? '' : contribForm(i, pot.remaining, 'Je mets')}
    </div>`;
  }
  if (openShare === i.id) {
    return `<div class="pot"><div class="line"><strong>Lancer un cadeau commun</strong><span>prix ${eur(i.price)}</span></div>
      ${contribForm(i, Math.round(i.price / 2), 'Je mets')}
      <p class="people">Tu seras l’acheteur par défaut. Les autres verront seulement le total et ce qu’il reste.</p></div>`;
  }
  return `<div class="status">
    <button class="btn primary" data-act="offer" data-id="${i.id}">Je l’offre</button>
    ${i.price ? `<button class="btn" data-act="openShare" data-id="${i.id}">Cadeau commun</button>` : '<span class="small">Sans prix indiqué, pas de cadeau commun possible.</span>'}
  </div>`;
}
function cardOther(i) {
  const secret = i.byId !== i.forId;
  return `<div class="card${secret ? ' secret' : ''}${i.removed ? ' removed' : ''}">
    <div class="row"><span class="title">${esc(i.title)}</span>${i.price ? `<span class="price">${eur(i.price)}</span>` : '<span class="meta">prix non indiqué</span>'}</div>
    ${metaLine(i, secret ? 'Idée secrète de ' + who(i.byId) : '')}
    ${statusOther(i)}
    ${i.byId === S.me && !i.removed ? `<div class="status"><button class="btn ghost" data-act="removeIdea" data-id="${i.id}">Retirer mon idée</button></div>` : ''}
  </div>`;
}
function renderPanel() {
  const own = sel === S.me, name = nm(sel), list = visible(sel);
  let html = `<div class="section"><span class="who ${own ? 'mine' : 'secret'}" style="align-self:flex-start">${own ? 'Ma boule' : 'Invisible pour ' + esc(name)}</span>
    <h2>${own ? 'Ma lettre aux anges' : 'La boule de ' + esc(name)}</h2>
    <p class="lead">${own
      ? 'Tes vœux pour le 24 au soir. Toute la famille les voit. Tu ne vois pas ce qui est réservé, ni les idées que les autres ont glissées pour toi.'
      : `Les vœux de ${esc(name)} et les idées glissées en secret par la famille. ${esc(name)} ne voit ni les idées secrètes, ni les réservations, ni les cagnottes.`}</p></div>`;
  if (own) {
    const mine = list.filter((i) => i.byId === S.me);
    html += `<div class="section"><h3>Mes vœux</h3><div class="list">${mine.length ? mine.map(cardMine).join('') : '<p class="empty">Ta lettre est encore vide. Ajoute ton premier vœu ci-dessous.</p>'}</div></div>`;
  } else {
    const wishes = list.filter((i) => i.byId === sel), secrets = list.filter((i) => i.byId !== sel);
    html += `<div class="section"><h3>Ses vœux</h3><div class="list">${wishes.length ? wishes.map(cardOther).join('') : `<p class="empty">${esc(name)} n’a encore rien demandé.</p>`}</div></div>`;
    html += `<div class="section"><h3>Idées secrètes de la famille</h3><div class="list">${secrets.length ? secrets.map(cardOther).join('') : '<p class="empty">Aucune idée secrète pour le moment.</p>'}</div></div>`;
  }
  html += `<form class="add" id="addForm">
    <div class="field full"><h3>${own ? 'Ajouter un vœu' : 'Glisser une idée secrète pour ' + esc(name)}</h3></div>
    <div class="field"><label for="f-title">Idée</label><input type="text" id="f-title" maxlength="140" required placeholder="${own ? 'Ex. un pull en laine vert' : 'Ex. une journée au spa'}"></div>
    <div class="field"><label for="f-price">Prix indicatif (€)</label><input type="number" id="f-price" min="1" step="1" inputmode="numeric" placeholder="optionnel"></div>
    <div class="field"><label for="f-link">Lien</label><input type="url" id="f-link" maxlength="500" placeholder="https:// (optionnel)"></div>
    ${own ? `<div class="field"><label for="f-prio">Envie</label><select id="f-prio"><option value="3">★★★ Très envie</option><option value="2" selected>★★ Envie</option><option value="1">★ Si possible</option></select></div>` : '<div></div>'}
    <div class="actions full"><button class="btn primary" type="submit">${own ? 'Ajouter à ma lettre' : 'Glisser l’idée en secret'}</button></div>
  </form>`;
  $('#panel').innerHTML = html;
}
function render() { if (view === 'room') renderPanel(); else renderScene(); countdown(); }

async function refresh() {
  try { S = await api('state'); render(); }
  catch (e) { if (e.status === 401) { S = null; showNoAccess('Session terminée'); } }
}
async function act(action, data, msg) {
  if (busy) return; busy = true;
  try { await api(action, data); openShare = null; if (msg) toast(msg); }
  catch (e) { toast(e.message); }
  finally { busy = false; await refresh(); }
}

document.addEventListener('click', (e) => {
  if (!S) return;
  if (view === 'facade' && e.target.closest('#stage') && mode !== 'frozen') {
    if (Date.now() - swipeAt > 400 && (mode === 'spin' || mode === 'glide')) snapTo(frontVisible() ? 'cal' : 'tree');
    return;
  }
  const o = e.target.closest('[data-person]');
  if (o) { if (Date.now() - swipeAt > 400) enterRoom(o.dataset.person); return; }
  const dd = e.target.closest('[data-day]');
  if (dd) { if (Date.now() - swipeAt > 400) openDay(+dd.dataset.day, dd); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.dataset.id;
  const i = S.ideas.find((x) => x.id === id);
  switch (b.dataset.act) {
    case 'openShare': openShare = id; render(); break;
    case 'closeShare': openShare = null; render(); break;
    case 'offer': act('offer', { id }, `Réservé. ${nm(i.forId)} ne le verra pas.`); break;
    case 'cancelOffer': act('cancelOffer', { id }, 'Réservation annulée.'); break;
    case 'contribute': {
      const v = Math.round(Number($('#amt-' + id).value));
      if (!(v >= 1)) { toast('Indique un montant.'); return; }
      act('contribute', { id, amount: v }, 'Participation enregistrée.'); break;
    }
    case 'leave': act('leave', { id }, 'Part retirée.'); break;
    case 'takeBuyer': act('takeBuyer', { id }, 'Tu t’occupes de l’achat.'); break;
    case 'removeIdea':
      if (confirm('Retirer cette idée ?')) act('removeIdea', { id }, 'Idée retirée.');
      break;
  }
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'addForm') return;
  e.preventDefault();
  const title = $('#f-title').value.trim(); if (!title) return;
  act('addIdea', {
    forId: sel, title, price: $('#f-price').value || null, link: $('#f-link').value.trim(),
    prio: $('#f-prio') ? Number($('#f-prio').value) : 0,
  }, sel === S.me ? 'Ajouté à ta lettre.' : 'Idée glissée en secret.');
});
document.addEventListener('visibilitychange', () => { if (S && document.visibilityState === 'visible') refresh(); });
setInterval(() => { if (S && document.visibilityState === 'visible' && !busy && !openShare && !document.activeElement.matches('input,select')) refresh(); }, 60000);
boot();
</script>
