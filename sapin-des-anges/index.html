<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Le Betlehem des Anges</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,2 4,28 28,28' fill='%231E5A3C'/%3E%3Ccircle cx='16' cy='17' r='3' fill='%23D2A23A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=DM+Serif+Display&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap" id="root"><p class="lead">Chargement du Betlehem…</p></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = (n) => Number(n).toLocaleString('fr-FR') + ' €';
// Fenêtres posées sur la crèche : centre (x, y) et taille en % de l'image (800×1000).
// Le coin bas-droit (signature de l'illustration) reste toujours visible.
const DOORS = [
  { x: 31, y: 12 }, { x: 14, y: 44 }, { x: 38, y: 41 }, { x: 82, y: 44 },
  { x: 72, y: 16 }, { x: 18, y: 75 }, { x: 76, y: 79 },
];
const DW = 19, DH = 15;
const NOEL = { x: 51, y: 63, w: 22, h: 16 };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
let view = 'facade', entering = false;
let S = null, sel = null, openShare = null, busy = false;

function toast(t) {
  const el = $('#toast'); el.textContent = t; el.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600);
}
async function api(action, data = {}) {
  const r = await fetch('/api/app', {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...data }),
  });
  let j = {}; try { j = await r.json(); } catch {}
  if (!r.ok) { const e = new Error(j.error || 'Connexion impossible. Vérifie ton réseau.'); e.status = r.status; throw e; }
  return j;
}
const nm = (id) => { const p = S.people.find((x) => x.id === id); return p ? p.name : 'un ancien membre'; };
const who = (id) => (id === S.me ? 'moi' : esc(nm(id)));

// ---------- Écrans d'accès ----------
function screen(html) { $('#root').innerHTML = `<div class="gate">${html}</div>`; }
function showMessage(title, msg) {
  screen(`<h1>Le Betlehem des Anges</h1><h2>${esc(title)}</h2><p class="lead">${esc(msg)}</p>`);
}
function showPin(token, h) {
  const choose = !h.hasPin;
  screen(`<h1>Le Betlehem des Anges</h1>
    <h2>Bonjour ${esc(h.name)} !</h2>
    <p class="lead">${choose
      ? 'Choisis ton code secret à 4 chiffres. Il protège tes surprises si quelqu’un d’autre utilise ton téléphone ou ta tablette. Évite ton année de naissance.'
      : 'Tape ton code secret à 4 chiffres.'}</p>
    <form id="pinForm" class="pinform" autocomplete="off">
      <div class="field"><label for="pin1">${choose ? 'Mon code' : 'Code'}</label>
        <input id="pin1" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autofocus></div>
      ${choose ? `<div class="field"><label for="pin2">Je le retape</label>
        <input id="pin2" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></div>` : ''}
      <p class="warn" id="pinErr" role="alert"></p>
      <button class="btn primary" type="submit">${choose ? 'Choisir ce code' : 'Entrer'}</button>
    </form>
    <p class="small">${choose
      ? 'Ce lien est personnel : ne le transfère à personne.'
      : 'Code oublié ? Demande à l’organisateur de réinitialiser ton lien.'}</p>`);
  $('#pinForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const p1 = $('#pin1').value.trim();
    const err = $('#pinErr');
    if (choose && p1 !== $('#pin2').value.trim()) { err.textContent = 'Les deux codes ne sont pas identiques.'; return; }
    try {
      await api(choose ? 'setPin' : 'login', { token, pin: p1 });
      history.replaceState(null, '', location.pathname);
      await loadApp(h.id);
    } catch (x) { err.textContent = x.message; $('#pin1').value = ''; if ($('#pin2')) $('#pin2').value = ''; $('#pin1').focus(); }
  });
}

async function boot() {
  const token = new URLSearchParams(location.search).get('t');
  if (token) {
    let h;
    try { h = await api('hello', { token }); }
    catch (e) { showMessage('Lien non reconnu', e.message); return; }
    try {
      const st = await api('state');
      if (st.me === h.id) { history.replaceState(null, '', location.pathname); S = st; startApp(); return; }
    } catch {}
    showPin(token, h);
    return;
  }
  try { S = await api('state'); startApp(); }
  catch (e) {
    if (e.status === 401) showMessage('Bienvenue', 'Pour accéder au Betlehem, ouvre le lien personnel que l’organisateur t’a envoyé.');
    else showMessage('Oups', e.message);
  }
}
async function loadApp() { S = await api('state'); sel = null; startApp(); }

// ---------- Application ----------
function startApp() {
  if (!sel || !S.people.some((p) => p.id === sel)) sel = S.me;
  $('#root').innerHTML = `
    <div id="facade" class="facade">
      <header class="top">
        <div>
          <h1>Le Betlehem des Anges</h1>
          <p class="sub">Bonjour <strong>${esc(nm(S.me))}</strong>. Ouvre ta fenêtre pour écrire ta lettre aux anges, ou celle d’un proche pour lui trouver un cadeau.</p>
        </div>
        <div class="controls">
          <p class="count" id="countdown"></p>
          <button class="btn ghost" id="logout" type="button">Ce n’est pas moi</button>
        </div>
      </header>
      <div class="stage" id="stage"><div class="scene" id="scene"></div></div>
      <div class="chips" id="chips" aria-label="Ouvrir une fenêtre"></div>
      <section class="section">
        <h3>Qui voit quoi</h3>
        <div class="legend">
          <div><b>Mes vœux</b>Visibles par toute la famille.</div>
          <div><b>Idées secrètes pour moi</b>Visibles par les autres, cachées pour moi jusqu’au 24 au soir, quand la porte de la crèche s’ouvre.</div>
          <div><b>Réservations et cagnottes</b>Jamais visibles par la personne qui reçoit. Les autres voient le total et le reste à financer ; seul l’acheteur voit qui a mis combien.</div>
        </div>
      </section>
    </div>
    <div id="room" class="room" hidden>
      <div class="roombar">
        <button class="btn" id="back" type="button">← Retour au Betlehem</button>
        <p class="count" id="countdown2"></p>
      </div>
      <main class="panel" id="panel"></main>
    </div>`;
  $('#logout').addEventListener('click', async () => {
    try { await api('logout'); } catch {}
    showMessage('À bientôt', 'Tu es déconnecté de cet appareil. Pour revenir, rouvre ton lien personnel.');
  });
  $('#back').addEventListener('click', leaveRoom);
  view = 'facade';
  render();
}
function visible(pid) { return S.ideas.filter((i) => i.forId === pid); }
function countdown() {
  let html;
  if (S.revealed) html = '<b>Szenteste</b> · Boldog karácsonyt !';
  else { const d = Math.max(0, Math.ceil((S.revealAt - Date.now()) / 864e5)); html = `<b>${d}</b> jour${d > 1 ? 's' : ''} avant Szenteste`; }
  for (const id of ['#countdown', '#countdown2']) { const el = $(id); if (el) el.innerHTML = html; }
}
function leafStyle(x, y, w, h) {
  const l = x - w / 2, t = y - h / 2;
  return `left:${l}%;top:${t}%;width:${w}%;height:${h}%;--bs:${(100 / w) * 100}% ${(100 / h) * 100}%;--bp:${(l / (100 - w)) * 100}% ${(t / (100 - h)) * 100}%`;
}
function renderScene() {
  const doors = S.people.slice(0, DOORS.length).map((p, k) => {
    const { x, y } = DOORS[k]; const n = visible(p.id).length; const mine = p.id === S.me;
    return `<button class="door${mine ? ' mine' : ''}" type="button" data-person="${p.id}" style="${leafStyle(x, y, DW, DH)}"
        aria-label="Fenêtre de ${esc(p.name)}${mine ? ' (toi)' : ''}, ${n} idée${n > 1 ? 's' : ''}">
      <span class="inside" aria-hidden="true"></span>
      <span class="leaf" aria-hidden="true"><span class="plate">${esc(p.name)}</span></span>
      ${n ? `<span class="badge" aria-hidden="true">${n}</span>` : ''}
    </button>`;
  }).join('');
  const noel = `<button class="door noel${S.revealed ? '' : ' locked'}" type="button" data-noel="1" style="${leafStyle(NOEL.x, NOEL.y, NOEL.w, NOEL.h)}"
      aria-label="${S.revealed ? 'Porte de la crèche : voir ce que la famille avait imaginé pour toi' : 'Porte de la crèche, fermée jusqu’au 24 décembre au soir'}">
    <span class="inside" aria-hidden="true"></span>
    <span class="leaf" aria-hidden="true"><span class="plate">24</span></span>
  </button>`;
  $('#scene').innerHTML = `<img src="/creche.jpg" alt="Crèche de Noël : l’étoile, les rois mages, Marie, Joseph et l’enfant, les bergers, l’âne, le bœuf et les moutons" width="800" height="1000">${doors}${noel}`;
  $('#chips').innerHTML = S.people.map((p) => `<button class="chip" type="button" data-person="${p.id}">${esc(p.name)}${p.id === S.me ? ' (moi)' : ''}</button>`).join('');
}
async function enterRoom(pid) {
  if (entering) return; entering = true;
  sel = pid; openShare = null;
  const door = document.querySelector(`.door[data-person="${pid}"]`) || (pid === S.me && S.revealed ? $('.door.noel') : null);
  if (door && !reduceMotion()) {
    door.classList.add('open');
    await wait(650);
    const scene = $('#scene'), r = door.getBoundingClientRect(), s = scene.getBoundingClientRect();
    scene.style.transformOrigin = `${((r.left + r.width / 2 - s.left) / s.width) * 100}% ${((r.top + r.height / 2 - s.top) / s.height) * 100}%`;
    document.documentElement.classList.add('zooming');
    $('#stage').classList.add('zoom');
    await wait(850);
  }
  view = 'room';
  $('#facade').hidden = true; $('#room').hidden = false;
  document.documentElement.classList.remove('zooming');
  renderPanel(); countdown(); window.scrollTo(0, 0);
  entering = false;
}
async function leaveRoom() {
  view = 'facade';
  $('#room').hidden = true; $('#facade').hidden = false;
  renderScene(); countdown();
  const stage = $('#stage'), door = document.querySelector(`.door[data-person="${sel}"]`) || $('.door.noel');
  const target = stage.getBoundingClientRect().top + scrollY - 80;
  window.scrollTo(0, Math.max(0, target));
  if (reduceMotion() || !door) return;
  const scene = $('#scene'), r = door.getBoundingClientRect(), s = scene.getBoundingClientRect();
  scene.style.transformOrigin = `${((r.left + r.width / 2 - s.left) / s.width) * 100}% ${((r.top + r.height / 2 - s.top) / s.height) * 100}%`;
  document.documentElement.classList.add('noscroll');
  door.classList.add('open');
  stage.classList.add('zoom', 'instant');
  stage.offsetWidth; // force la position zoomée avant de reculer
  stage.classList.remove('instant');
  requestAnimationFrame(() => stage.classList.remove('zoom'));
  await wait(850);
  door.classList.remove('open');
  document.documentElement.classList.remove('noscroll');
}
const stars = (n) => n ? '★'.repeat(n) + '<span style="opacity:.3">' + '★'.repeat(3 - n) + '</span>' : '';
function metaLine(i, secretLabel) {
  return `<div class="meta">${i.prio ? `<span class="stars" aria-label="envie ${i.prio} sur 3">${stars(i.prio)}</span>` : ''}
    ${i.link ? `<a href="${esc(i.link)}" target="_blank" rel="noopener noreferrer">voir le lien</a>` : ''}
    ${secretLabel ? `<span class="who secret">${secretLabel}</span>` : ''}</div>`;
}
function cardMine(i) {
  const secret = i.byId !== i.forId;
  return `<div class="card${secret ? ' secret' : ''}">
    <div class="row"><span class="title">${esc(i.title)}</span>${i.price ? `<span class="price">${eur(i.price)}</span>` : ''}</div>
    ${metaLine(i, secret ? 'Imaginée par ' + esc(nm(i.byId)) : '')}
    ${secret ? '' : `<div class="status"><button class="btn ghost" data-act="removeIdea" data-id="${i.id}">Retirer de ma liste</button></div>`}
  </div>`;
}
function contribForm(i, suggest, label) {
  return `<div class="inline"><label for="amt-${i.id}" class="people">${label}</label>
    <input type="number" id="amt-${i.id}" min="1" step="1" value="${suggest || ''}" inputmode="numeric"><span>€</span>
    <button class="btn primary" data-act="contribute" data-id="${i.id}">Participer</button>
    ${openShare === i.id ? `<button class="btn ghost" data-act="closeShare" data-id="${i.id}">Annuler</button>` : ''}</div>`;
}
function statusOther(i) {
  const pot = i.pot;
  if (i.removed) {
    return `<p class="warn">${esc(nm(i.forId))} a retiré ce vœu de sa liste. Tu l’avais réservé : vérifie avant d’acheter.</p>
      <div class="status">${i.fullBy === S.me ? `<button class="btn" data-act="cancelOffer" data-id="${i.id}">Annuler ma réservation</button>` : ''}
      ${pot && pot.mine != null ? `<button class="btn" data-act="leave" data-id="${i.id}">Retirer ma part</button>` : ''}</div>`;
  }
  if (i.fullBy) {
    return `<div class="status"><span class="tag ok">${i.fullBy === S.me ? 'Je l’offre' : 'Offert par ' + esc(nm(i.fullBy))}</span>
      ${i.fullBy === S.me ? `<button class="btn ghost" data-act="cancelOffer" data-id="${i.id}">Annuler</button>` : ''}</div>`;
  }
  if (pot) {
    const p = i.price, t = pot.total, done = pot.remaining === 0, pct = Math.min(100, Math.round(t / p * 100));
    return `<div class="pot">
      <div class="line"><strong>Cadeau commun</strong><span>${eur(t)} / ${eur(p)}${done ? ' · financé' : ` · reste ${eur(pot.remaining)}`}</span></div>
      <div class="bar${done ? ' full' : ''}"><span style="width:${pct}%"></span></div>
      <p class="people">${pot.count} participant${pot.count > 1 ? 's' : ''} · achat : ${pot.buyer ? who(pot.buyer) : 'à désigner'}${pot.mine != null ? ` · ma part : ${eur(pot.mine)}` : ''}</p>
      ${pot.detail ? `<p class="people">À récupérer (visible par toi seul, l’acheteur) : ${pot.detail.filter((d) => d.by !== S.me).map((d) => `${esc(nm(d.by))} ${eur(d.amount)}`).join(' · ') || 'personne pour l’instant'}</p>` : ''}
      ${pot.mine != null
        ? `<div class="inline">${pot.buyer !== S.me ? `<button class="btn" data-act="takeBuyer" data-id="${i.id}">Je m’occupe de l’achat</button>` : ''}
           <button class="btn ghost" data-act="leave" data-id="${i.id}">Retirer ma part</button></div>`
        : done ? '' : contribForm(i, pot.remaining, 'Je mets')}
    </div>`;
  }
  if (openShare === i.id) {
    return `<div class="pot"><div class="line"><strong>Lancer un cadeau commun</strong><span>prix ${eur(i.price)}</span></div>
      ${contribForm(i, Math.round(i.price / 2), 'Je mets')}
      <p class="people">Tu seras l’acheteur par défaut. Les autres verront seulement le total et ce qu’il reste.</p></div>`;
  }
  return `<div class="status">
    <button class="btn primary" data-act="offer" data-id="${i.id}">Je l’offre</button>
    ${i.price ? `<button class="btn" data-act="openShare" data-id="${i.id}">Cadeau commun</button>` : '<span class="small">Sans prix indiqué, pas de cadeau commun possible.</span>'}
  </div>`;
}
function cardOther(i) {
  const secret = i.byId !== i.forId;
  return `<div class="card${secret ? ' secret' : ''}${i.removed ? ' removed' : ''}">
    <div class="row"><span class="title">${esc(i.title)}</span>${i.price ? `<span class="price">${eur(i.price)}</span>` : '<span class="meta">prix non indiqué</span>'}</div>
    ${metaLine(i, secret ? 'Idée secrète de ' + who(i.byId) : '')}
    ${statusOther(i)}
    ${i.byId === S.me && !i.removed ? `<div class="status"><button class="btn ghost" data-act="removeIdea" data-id="${i.id}">Retirer mon idée</button></div>` : ''}
  </div>`;
}
function renderPanel() {
  const own = sel === S.me, name = nm(sel), list = visible(sel);
  let html = `<div class="section"><span class="who ${own ? 'mine' : 'secret'}" style="align-self:flex-start">${own ? 'Ma boule' : 'Invisible pour ' + esc(name)}</span>
    <h2>${own ? 'Ma lettre aux anges' : 'La boule de ' + esc(name)}</h2>
    <p class="lead">${own
      ? 'Tes vœux pour le 24 au soir. Toute la famille les voit. Tu ne vois pas ce qui est réservé, ni les idées que les autres ont glissées pour toi.'
      : `Les vœux de ${esc(name)} et les idées glissées en secret par la famille. ${esc(name)} ne voit ni les idées secrètes, ni les réservations, ni les cagnottes.`}</p></div>`;
  if (own) {
    const mine = list.filter((i) => i.byId === S.me), secrets = list.filter((i) => i.byId !== S.me);
    if (S.revealed) html += `<div class="reveal"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v4l-2 3h16l-2-3V9a6 6 0 0 0-6-6zm-2 15a2 2 0 0 0 4 0" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round"/></svg><p><strong>La clochette a sonné.</strong> Les anges sont passés : voici les idées que la famille avait imaginées pour toi.</p></div>`;
    html += `<div class="section"><h3>Mes vœux</h3><div class="list">${mine.length ? mine.map(cardMine).join('') : '<p class="empty">Ta lettre est encore vide. Ajoute ton premier vœu ci-dessous.</p>'}</div></div>`;
    if (S.revealed) html += `<div class="section"><h3>Ce que la famille avait imaginé</h3><div class="list">${secrets.length ? secrets.map(cardMine).join('') : '<p class="empty">Aucune idée secrète cette année.</p>'}</div></div>`;
  } else {
    const wishes = list.filter((i) => i.byId === sel), secrets = list.filter((i) => i.byId !== sel);
    html += `<div class="section"><h3>Ses vœux</h3><div class="list">${wishes.length ? wishes.map(cardOther).join('') : `<p class="empty">${esc(name)} n’a encore rien demandé.</p>`}</div></div>`;
    html += `<div class="section"><h3>Idées secrètes de la famille</h3><div class="list">${secrets.length ? secrets.map(cardOther).join('') : '<p class="empty">Aucune idée secrète pour le moment.</p>'}</div></div>`;
  }
  html += `<form class="add" id="addForm">
    <div class="field full"><h3>${own ? 'Ajouter un vœu' : 'Glisser une idée secrète pour ' + esc(name)}</h3></div>
    <div class="field"><label for="f-title">Idée</label><input type="text" id="f-title" maxlength="140" required placeholder="${own ? 'Ex. un pull en laine vert' : 'Ex. une journée au spa'}"></div>
    <div class="field"><label for="f-price">Prix indicatif (€)</label><input type="number" id="f-price" min="1" step="1" inputmode="numeric" placeholder="optionnel"></div>
    <div class="field"><label for="f-link">Lien</label><input type="url" id="f-link" maxlength="500" placeholder="https:// (optionnel)"></div>
    ${own ? `<div class="field"><label for="f-prio">Envie</label><select id="f-prio"><option value="3">★★★ Très envie</option><option value="2" selected>★★ Envie</option><option value="1">★ Si possible</option></select></div>` : '<div></div>'}
    <div class="actions full"><button class="btn primary" type="submit">${own ? 'Ajouter à ma lettre' : 'Glisser l’idée en secret'}</button></div>
  </form>`;
  $('#panel').innerHTML = html;
}
function render() { if (view === 'room') renderPanel(); else renderScene(); countdown(); }

async function refresh() {
  try { S = await api('state'); render(); }
  catch (e) { if (e.status === 401) showMessage('Session terminée', e.message); }
}
async function act(action, data, msg) {
  if (busy) return; busy = true;
  try { await api(action, data); openShare = null; if (msg) toast(msg); }
  catch (e) { toast(e.message); }
  finally { busy = false; await refresh(); }
}

document.addEventListener('click', (e) => {
  if (!S) return;
  const o = e.target.closest('[data-person]');
  if (o) { enterRoom(o.dataset.person); return; }
  const n = e.target.closest('[data-noel]');
  if (n) {
    if (S.revealed) { enterRoom(S.me); return; }
    n.classList.remove('shake'); void n.offsetWidth; n.classList.add('shake');
    toast('Cette porte s’ouvrira le 24 décembre à 18 h, quand les anges seront passés.');
    return;
  }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.dataset.id;
  const i = S.ideas.find((x) => x.id === id);
  switch (b.dataset.act) {
    case 'openShare': openShare = id; render(); break;
    case 'closeShare': openShare = null; render(); break;
    case 'offer': act('offer', { id }, `Réservé. ${nm(i.forId)} ne le verra pas.`); break;
    case 'cancelOffer': act('cancelOffer', { id }, 'Réservation annulée.'); break;
    case 'contribute': {
      const v = Math.round(Number($('#amt-' + id).value));
      if (!(v >= 1)) { toast('Indique un montant.'); return; }
      act('contribute', { id, amount: v }, 'Participation enregistrée.'); break;
    }
    case 'leave': act('leave', { id }, 'Part retirée.'); break;
    case 'takeBuyer': act('takeBuyer', { id }, 'Tu t’occupes de l’achat.'); break;
    case 'removeIdea':
      if (confirm('Retirer cette idée ?')) act('removeIdea', { id }, 'Idée retirée.');
      break;
  }
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'addForm') return;
  e.preventDefault();
  const title = $('#f-title').value.trim(); if (!title) return;
  act('addIdea', {
    forId: sel, title, price: $('#f-price').value || null, link: $('#f-link').value.trim(),
    prio: $('#f-prio') ? Number($('#f-prio').value) : 0,
  }, sel === S.me ? 'Ajouté à ta lettre.' : 'Idée glissée en secret.');
});
document.addEventListener('visibilitychange', () => { if (S && document.visibilityState === 'visible') refresh(); });
